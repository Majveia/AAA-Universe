<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ÆON — A Living Universe</title>
    <style>
      :root {
        --ink: #e8ecf4;
        --dim: #7c8798;
        --accent: #6fd3ff;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ink);
        font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #app { position: fixed; inset: 0; }
      canvas#stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }

      /* ---------- Boot / loading veil ---------- */
      #veil {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 45%, #05070c 0%, #000 70%);
        transition: opacity 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #veil.gone { opacity: 0; pointer-events: none; }

      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        transform: translateY(-3vh);
      }
      .mark {
        font-size: clamp(34px, 8vw, 74px);
        font-weight: 200;
        letter-spacing: 0.42em;
        margin-left: 0.42em;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 0%, #9fb4d0 55%, #4a5f7d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        animation: rise 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .sub {
        font-size: clamp(9px, 2.2vw, 11px);
        letter-spacing: 0.5em;
        margin-left: 0.5em;
        text-transform: uppercase;
        color: var(--dim);
        opacity: 0;
        animation: rise 2.2s 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); filter: blur(8px); }
        to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
      }
      .bar {
        width: min(320px, 62vw);
        height: 1px;
        background: rgba(255, 255, 255, 0.09);
        position: relative;
        overflow: hidden;
        opacity: 0;
        animation: rise 1.6s 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .bar > i {
        position: absolute;
        inset: 0 100% 0 0;
        background: linear-gradient(90deg, transparent, var(--accent));
        transition: right 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        box-shadow: 0 0 12px 1px rgba(111, 211, 255, 0.55);
      }
      .status {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #55617a;
        height: 1em;
        opacity: 0;
        animation: rise 1.6s 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Enter prompt ---------- */
      #enter {
        position: fixed;
        inset: 0;
        z-index: 900;
        display: none;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.82) 75%);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        cursor: pointer;
        transition: opacity 0.9s ease;
      }
      #enter.show { display: grid; }
      #enter.fade { opacity: 0; pointer-events: none; }
      #enter .inner { text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; }
      #enter .big {
        font-size: clamp(11px, 2.6vw, 13px);
        letter-spacing: 0.55em;
        margin-left: 0.55em;
        text-transform: uppercase;
        color: #cfe3f5;
        animation: pulse 3.4s ease-in-out infinite;
      }
      #enter .hint { font-size: 11px; letter-spacing: 0.12em; color: #5d6a80; max-width: 34ch; line-height: 1.7; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      #fatal {
        position: fixed; inset: 0; z-index: 2000; display: none;
        place-items: center; background: #04070c; padding: 24px; text-align: center;
      }
      #fatal.show { display: grid; }
      #fatal .t { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #ff7a7a; margin-bottom: 14px; }
      #fatal .m { font-size: 12px; color: #8b98ab; font-family: ui-monospace, monospace; max-width: 70ch; line-height: 1.7; white-space: pre-wrap; }

      @media (prefers-reduced-motion: reduce) {
        .mark, .sub, .bar, .status { animation-duration: 0.01ms !important; opacity: 1 !important; }
        #enter .big { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
    </div>

    <div id="enter">
      <div class="inner">
        <div class="big">Enter</div>
        <div class="hint">Click or tap to begin. Headphones recommended.</div>
      </div>
    </div>

    <div id="veil">
      <div class="boot">
        <div class="mark">ÆON</div>
        <div class="sub">A Living Universe</div>
        <div class="bar"><i id="bar-fill"></i></div>
        <div class="status" id="boot-status">initialising</div>
      </div>
    </div>

    <div id="fatal">
      <div>
        <div class="t">The universe failed to ignite</div>
        <div class="m" id="fatal-msg"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
